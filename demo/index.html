    <style>
        :root {
            --h-backdrop-color: rgba(121, 121, 121, 0.24);
            --h-backdrop-blur: 1px;
            --h-dialog-box-width: 400px;
            --h-success-color: #00dc63;
            --h-warning-color: #f5a442;
            --h-danger-color: #ed3232;
        }

        body {
            min-height: 1000vh;
        }

        .dialog {
            background-color: var(--h-backdrop-color);
            position: fixed;
            width: 100%;
            height: 100%;
            inset: 0;
            font-family: Arial, Helvetica, sans-serif;
            line-height: 1.5em;
        }

        .dialog.show {
            opacity: 1;
            pointer-events: auto;
        }


        .dialog.dialog-container {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-flow: column;
        }

        .dialog>.dialog-box {
            background-color: white;
            max-width: var(--h-dialog-box-width);
            width: 80%;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 0px 3px var(--h-backdrop-color);
            overflow: hidden;
        }

        .dialog>.dialog-box>.dialog-header {
            font-size: 18px;
            font-weight: 600;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .dialog>.dialog-box>.dialog-header>.dialog-header-close {
            width: 30px;
            height: 30px;
            border-radius: 100px;
            padding: 0;
            outline: none;
            border: none;
            box-shadow: none;
            display: flex;
            align-items: center;
            justify-content: center;
            right: -5px;
            top: -10px;
            padding: 1px;
            z-index: 1;
            cursor: pointer;
            background-color: transparent;
        }

        .dialog>.dialog-box>.dialog-footer {
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .dialog>.dialog-box>.dialog-footer>.dialog-btn {
            width: 100%;
            padding: 8px;
            font-size: 16px;
            cursor: pointer;
            outline: none;
            border: none;
            box-shadow: none;
            border-radius: 5px;
        }

        .dialog>.dialog-box>.dialog-footer>.dialog-btn-close {
            background-color: var(--h-danger-color);
            color: white;
        }

        .dialog>.dialog-box>.dialog-footer>.dialog-btn-confirm {
            background-color: var(--h-success-color);
            color: white;
        }


        .dialog>.dialog-box>.dialog-body {
            max-height: 400px;
            overflow-y: scroll;
            padding: 10px 15px;
            font-size: 16px;
            font-weight: 500;
        }

        .dialog>.dialog-box>.dialog-body>.dialog-status-icon {
            margin-bottom: 10px;
            text-align: center;
        }

        .dialog>.dialog-box>.dialog-body>.dialog-status-icon>svg {
            width: 80px;
            height: 80px;
            color: var(--h-success-color);
        }
    </style>
</head>

<body>
    <button onclick="handleSuccess()">click</button>
    <button onclick="handleConfirm()">Confirm</button>
